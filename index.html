<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entreno">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Entreno en Casa</title>
<meta name="theme-color" content="#111a23">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna de app móvil (máx. 560px) con barra de pestañas fija abajo; tarjeta "marcador" oscura para la sesión del día */
:root{
  --bg:#edf0f3; --surface:#ffffff; --sunk:#e3e8ed; --ink:#111a23; --muted:#56626e; --line:#d3dae1;
  --accent:#e2481f; --accent-ink:#ffffff; --band:#2b6be6; --ok:#17885a;
  --fig:#111a23; --fig-far:#9aa6b2; --prop:#8794a1; --mat:#d7dee5;
  --hero-bg:#111a23; --hero-ink:#f4f6f8; --hero-muted:#a9b4bf;
  --f-disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1217; --surface:#161e26; --sunk:#1e2832; --ink:#e6ebf0; --muted:#8e9aa6; --line:#27323d;
  --accent:#ff6a3d; --accent-ink:#1a0c06; --band:#6f9bff; --ok:#3ccf8a;
  --fig:#e6ebf0; --fig-far:#5c6976; --prop:#6b7885; --mat:#24303b;
  --hero-bg:#1c2630; --hero-ink:#f4f6f8; --hero-muted:#93a0ad; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1217; --surface:#161e26; --sunk:#1e2832; --ink:#e6ebf0; --muted:#8e9aa6; --line:#27323d;
  --accent:#ff6a3d; --accent-ink:#1a0c06; --band:#6f9bff; --ok:#3ccf8a;
  --fig:#e6ebf0; --fig-far:#5c6976; --prop:#6b7885; --mat:#24303b;
  --hero-bg:#1c2630; --hero-ink:#f4f6f8; --hero-muted:#93a0ad; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--band);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1{font-size:34px;line-height:1}
h2{font-size:22px;line-height:1.1}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.head{display:flex;flex-direction:column;gap:4px}

/* tarjeta marcador */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{color:var(--hero-muted)}
.hero h2{font-size:38px;text-transform:uppercase;line-height:.95}
.hero .sub{color:var(--hero-muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--f-disp);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--hero-muted)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.hero .btn.sec{border-color:rgba(255,255,255,.25);color:var(--hero-ink)}
.btn.wide{width:100%}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 140px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.hero .pill.ok{background:rgba(60,207,138,.18);color:#5ee0a2}

/* listas de ejercicios */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-t{display:flex;justify-content:space-between;align-items:baseline}
.list{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.ex{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex:hover{background:var(--sunk)}
.ex .nm{font-weight:600;min-width:0}
.ex .mt{font-size:12px;color:var(--muted)}
.ex .px{font-family:var(--f-disp);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ex .px small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--muted);display:block;text-align:right}
.thumb{width:60px;height:48px;background:var(--sunk);border-radius:10px;overflow:hidden;display:block}
.thumb svg{width:100%;height:100%}

/* figura */
.fig{display:block;width:100%;height:100%}
.fig .lim{fill:none;stroke:var(--fig);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.fig .lim.far{stroke:var(--fig-far)}
.fig .hd{fill:var(--fig)}
.fig .gnd{stroke:var(--line);stroke-width:2}
.fig .prop{fill:none;stroke:var(--prop);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig .band{fill:none;stroke:var(--band);stroke-width:3;stroke-linecap:round}
.fig .anc{fill:var(--band)}
.fig .mat{fill:var(--mat)}
.thumb .fig .lim{stroke-width:10}
.thumb .fig .prop{stroke-width:6}
.thumb .fig .band{stroke-width:5}

/* card genérica */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}

/* semana */
.wk-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.days{display:flex;flex-direction:column;gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day-h{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px;border:0;background:none;text-align:left}
.day-h .dn{display:flex;flex-direction:column;align-items:center;line-height:1}
.day-h .dn b{font-family:var(--f-disp);font-size:26px}
.day-h .dn span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.rest .tt{color:var(--muted)}
.day-b{padding:0 12px 14px;display:flex;flex-direction:column;gap:12px}
.tt{font-weight:600}

/* catálogo */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .art{aspect-ratio:240/185;max-width:100%;background:var(--sunk);border-radius:10px;overflow:hidden}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25}
.tile .mt{font-size:12px;color:var(--muted)}

/* progreso */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-disp);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:64px repeat(7,1fr);gap:5px;align-items:center;font-size:11px}
.cal .h{color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.cal .wl{color:var(--muted);font-variant-numeric:tabular-nums}
.sq{aspect-ratio:1;border-radius:5px;background:transparent;border:1.5px dashed var(--line)}
.sq.plan{border:1.5px solid var(--muted);background:transparent}
.sq.done{background:var(--accent);border-color:var(--accent)}
.sq.extra{background:var(--ok);border-color:var(--ok)}
.sq.fut{opacity:.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hist{display:flex;flex-direction:column}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hist div:first-child{border-top:0}

/* ajustes */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dsel button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0;font-weight:700;font-size:13px}
.dsel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.set-l{font-weight:600}
.alt-row{display:flex;flex-direction:column;gap:6px}
.hero .seg{background:rgba(255,255,255,.08)}
.hero .seg button{color:var(--hero-ink)}
.hero .seg button[aria-pressed="true"]{background:var(--hero-ink);color:var(--hero-bg)}
.note{font-size:13px;color:var(--muted)}
.danger{color:var(--accent);border-color:var(--accent)!important}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* hoja de detalle */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(5,10,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet .art{background:var(--sunk);border-radius:14px;aspect-ratio:240/185;max-width:100%}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}

/* modo entrenamiento */
.wo{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wo-in{max-width:560px;margin:0 auto;min-height:100%;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.wo-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.wo .art{background:var(--surface);border:1px solid var(--line);border-radius:18px;aspect-ratio:240/185;max-width:100%;max-height:42vh;margin:0 auto;width:100%}
.wo .art .fig{max-height:42vh}
.wo-name{font-family:var(--f-disp);font-size:32px;font-weight:700;line-height:1;text-transform:uppercase;border:0;background:none;padding:0;text-align:left}
.big{font-family:var(--f-disp);font-weight:700;font-size:88px;line-height:.9;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:10px}
.big small{font-size:22px;color:var(--muted);font-weight:600}
.wo.rest .wo-in{background:none}
.wo.rest .big{color:var(--band)}
.next{display:grid;grid-template-columns:60px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.sync{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>

<script>
/* ============================================================
   FIGURA ANIMADA (cinemática con IK de 2 huesos)
   ============================================================ */
const G=155, L={t:44,ua:24,fa:22,th:30,sh:30,head:9,neck:4};
const D2R=Math.PI/180;
const dir=a=>[Math.sin(a*D2R),Math.cos(a*D2R)];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const mul=(v,k)=>[v[0]*k,v[1]*k];
function ik(S,T,a,b,pref){
  let dx=T[0]-S[0],dy=T[1]-S[1],d=Math.hypot(dx,dy)||0.001;
  const maxd=a+b-0.05,mind=Math.abs(a-b)+0.5;
  let tx=T[0],ty=T[1];
  if(d>maxd||d<mind){const nd=d>maxd?maxd:mind;tx=S[0]+dx/d*nd;ty=S[1]+dy/d*nd;dx=tx-S[0];dy=ty-S[1];d=nd;}
  const base=Math.atan2(dy,dx);
  const A=Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d))));
  const j1=[S[0]+a*Math.cos(base+A),S[1]+a*Math.sin(base+A)];
  const j2=[S[0]+a*Math.cos(base-A),S[1]+a*Math.sin(base-A)];
  const mx=(S[0]+tx)/2,my=(S[1]+ty)/2;
  const s1=(j1[0]-mx)*pref[0]+(j1[1]-my)*pref[1],s2=(j2[0]-mx)*pref[0]+(j2[1]-my)*pref[1];
  return {j:s1>=s2?j1:j2,e:[tx,ty]};
}
// postura de pie base
const st=o=>Object.assign({hip:[120,90],t:180,aa:[124,150],ab:[116,150],wa:[123,91],wb:[118,91]},o);
function canon(p){
  p=Object.assign({},p);
  if(p.plank){const[ax,ay,sx,sy]=p.plank;const dx=sx-ax,dy=sy-ay,d=Math.hypot(dx,dy),k=(L.th+L.sh-0.5)/d;
    p.hip=[ax+dx*k,ay+dy*k];p.t=Math.atan2(sx-p.hip[0],sy-p.hip[1])/D2R;
    if(!p.aa)p.aa=[ax,ay];if(!p.ab)p.ab=[ax-3,ay];delete p.plank;}
  if(p.n==null)p.n=0;if(p.c==null)p.c=0;
  const sh=add(p.hip,mul(dir(p.t),L.t));
  if(!p.wa)p.wa=[sh[0]+2,sh[1]+45];if(!p.wb)p.wb=[sh[0]-2,sh[1]+45];
  if(!p.aa)p.aa=[p.hip[0]+3,p.hip[1]+59];if(!p.ab)p.ab=[p.hip[0]-3,p.hip[1]+59];
  return p;
}
const ANIM={
  sentadilla:{p:[st({wa:[162,50],wb:[158,52]}),st({hip:[96,120],t:150,wa:[160,86],wb:[156,88]})]},
  salto:{d:1600,p:[st({hip:[100,118],t:150,wa:[100,110],wb:[96,110]}),st({hip:[120,72],aa:[126,134],ab:[118,134],wa:[130,-14],wb:[126,-12]})]},
  zancada:{kb:[1,0.2],p:[st({aa:[146,150],ab:[98,150],wa:[126,90],wb:[122,90]}),st({hip:[120,120],aa:[146,150],ab:[94,146],wa:[126,120],wb:[122,120]})]},
  puente:{kb:[0,-1],eb:[0,-1],p:[{hip:[118,146],t:-90,aa:[152,150],ab:[148,150],wa:[118,152],wb:[114,152]},{hip:[118,124],t:-58,n:-32,aa:[152,150],ab:[148,150],wa:[118,152],wb:[114,152]}]},
  bulgara:{kb:[1,0.4],props:[{k:'chair',x:56,w:42,y:122}],p:[{hip:[122,88],t:178,aa:[146,150],ab:[86,120],wa:[130,90],wb:[126,90]},{hip:[120,118],t:172,aa:[146,150],ab:[86,120],wa:[128,118],wb:[124,118]}]},
  talones:{d:1800,p:[st({}),st({hip:[120,80],aa:[124,140],ab:[116,140],wa:[123,81],wb:[118,81]})]},
  monster:{d:1800,props:[{k:'band',a:'aa',b:'ab'}],p:[{hip:[112,104],t:165,aa:[98,150],ab:[128,150],wa:[128,100],wb:[124,100]},{hip:[128,104],t:165,aa:[112,150],ab:[142,150],wa:[144,100],wb:[140,100]}]},
  rumano:{eb:[0,1],props:[{k:'band',a:[124,150],b:'wa'}],p:[st({wa:[126,92],wb:[122,92]}),st({hip:[96,90],t:100,wa:[138,122],wb:[134,122]})]},
  pared:{d:3000,props:[{k:'wall',x:72}],p:[{hip:[82,118],t:180,aa:[118,150],ab:[114,150],wa:[100,118],wb:[96,118]},{hip:[82,117],t:180,aa:[118,150],ab:[114,150],wa:[100,117],wb:[96,117]}]},

  const second=alt&&ph>=0.5,la=alt?(second?0:lift):lift,lb=alt?(second?lift:0):lift;
  return {hip:[120,90-(alt?lift*0.4:lift)],t:180,aa:[124,150-la*(alt?1.6:1)],ab:[116,150-lb*(alt?1.6:1)],

const ease=f=>{if(f<.18)return 0;if(f>.82)return 1;const x=(f-.18)/.64;return x*x*(3-2*x);};
function lerp(a,b,e){const o={};for(const k in a){const x=a[k],y=b[k]==null?x:b[k];
  o[k]=Array.isArray(x)?x.map((v,i)=>v+(y[i]-v)*e):typeof x==='number'?x+(y-x)*e:x;}return o;}
function poseAt(A,ph){

  const x=ph*n,i=Math.floor(x)%n,f=x-Math.floor(x);
  return lerp(A.P[i],A.P[(i+1)%n],ease(f));

function solve(p,A){

    else if(isBand){
      const pt=v=>Array.isArray(v)?v:({wa:s.armA.e,wb:s.armB.e,aa:s.legA.e,ab:s.legB.e})[v];

function figMarkup(key,ph){
  const A=ANIM[key]||ANIM.sentadilla,s=solve(poseAt(A,ph),A);
  const ctrl=add(mul(add(s.hip,s.sh),.5),mul(dir(s.t+90),s.c));
  let o=`<line class="gnd" x1="6" y1="${G}" x2="234" y2="${G}"/>`+propsMarkup(A,s,false);
  o+=`<polyline class="lim far" points="${pl([s.sh,s.armB.j,s.armB.e])}"/>`;
  o+=`<polyline class="lim far" points="${pl([s.hip,s.legB.j,s.legB.e,toe(s.legB,A)])}"/>`;
  o+=`<path class="lim" d="M${f1(s.hip[0])} ${f1(s.hip[1])}Q${f1(ctrl[0])} ${f1(ctrl[1])} ${f1(s.sh[0])} ${f1(s.sh[1])}"/>`;

const LIVE=new Set();let raf=0;
function mountFig(el,key,label){

  const f={el,g:el.querySelector('g'),key,t0:performance.now()};
  f.g.innerHTML=figMarkup(key,0);LIVE.add(f);if(!raf)raf=requestAnimationFrame(loop);
}
function loop(now){
  raf=0;
  for(const f of LIVE){
    if(!f.el.isConnected){LIVE.delete(f);continue;}
    const A=ANIM[f.key]||ANIM.sentadilla,el=Math.max(0,now-f.t0);let ph;
    if(REDUCED){const step=Math.floor(el/1600);ph=A.fn?(step%4)*.25:(step%A.P.length)/A.P.length;}
    else ph=(el%(A.d||2400))/(A.d||2400);
    f.g.innerHTML=figMarkup(f.key,ph);
  }
  if(LIVE.size)raf=requestAnimationFrame(loop);
}

const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DC=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const dow=d=>(d.getDay()+6)%7;
const weeksBetween=(a,b)=>Math.round((b-a)/(7*864e5));
const fmtDate=d=>`${d.getDate()} ${MES[d.getMonth()]}`;
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};

const LS='entreno-casa.v1';
function defState(){return{v:1,settings:{days:[1,0,0,1,1,1,1],level:1,dur:30,start:ymd(monday(today()))},history:[],updatedAt:0};}
function normalize(o){const d=defState();o=o||{};
  return{v:1,settings:Object.assign(d.settings,o.settings||{}),history:Array.isArray(o.history)?o.history.slice(-400):[],alt:(o.alt&&typeof o.alt==='object')?Object.assign({},o.alt):{},updatedAt:o.updatedAt||0};}
let S=defState();
try{const raw=localStorage.getItem(LS);if(raw)S=normalize(JSON.parse(raw));}catch(e){}
let remote=null,writing=false,dirty=false,syncMsg='Guardado en este dispositivo';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function commit(){S.updatedAt=Date.now();S.history=S.history.slice(-400);saveLocal();pushRemote();render();}
async function pushRemote(){
  if(!remote)return;if(writing){dirty=true;return;}
  writing=true;
  try{await remote.set(JSON.parse(JSON.stringify(S)));syncMsg='Sincronizado con tu cuenta';}
  catch(e){syncMsg='Guardado solo en este dispositivo';if(e&&e.code==='invalid_argument')remote=null;}
  writing=false;if(dirty){dirty=false;pushRemote();}
  const el=document.getElementById('sync');if(el)el.textContent=syncMsg;
}
(async()=>{try{
  if(!window.claude||typeof claude.use!=='function')return;
  const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/estado');
  const snap=await ref.get();remote=ref;syncMsg='Sincronizado con tu cuenta';
  if(snap.exists){const r=normalize(JSON.parse(JSON.stringify(snap.data())));
    if(r.updatedAt>S.updatedAt){S=r;saveLocal();render();}else if(S.updatedAt>r.updatedAt)pushRemote();}
  else if(S.updatedAt)pushRemote();
  const el=document.getElementById('sync');if(el)el.textContent=syncMsg;
}catch(e){}})();

const TYPES={
  sup:{n:'Tren superior',d:'Empuje y tirón con banda, más core'},
  inf:{n:'Piernas y core',d:'Piernas con peso corporal y banda'},
  full:{n:'Cuerpo completo',d:'Todo el cuerpo con cierre de cardio'},
  bici_int:{n:'Bici: intervalos',d:'Tramos fuertes y recuperación, más core'},
  bici_z2:{n:'Bici: ritmo suave',d:'Pedaleo continuo y movilidad'},
  movil:{n:'Movilidad y paseo',d:'Recuperación activa'},
  extra:{n:'Movilidad exprés',d:'Rutina corta para días de descanso'},
  soga_int:{n:'Soga: intervalos',d:'Saltar la soga afuera: tramos fuertes y recuperación, más core'},
  soga_int_casa:{n:'Cardio en casa: intervalos',d:'Plan B sin salir ni soga: tramos fuertes en circuito, más core'},
  bici_int_casa:{n:'Cardio en casa: intervalos',d:'Plan B sin salir: tramos fuertes en circuito, más core'},
  bici_z2_casa:{n:'Cardio suave en casa',d:'Plan B sin salir: circuito continuo de bajo impacto'},
  movil_casa:{n:'Movilidad y marcha en casa',d:'Plan B sin salir: recuperación activa'},
};
const OUTDOOR={bici_int:'Bici',soga_int:'Soga',bici_z2:'Bici',movil:'Caminata'};
const TPL={1:['full'],2:['full','full'],3:['full','bici_int','full'],4:['sup','inf','bici_int','full'],
  5:['sup','inf','bici_int','full','bici_z2'],6:['sup','inf','bici_int','full','bici_z2','movil'],
  7:['sup','inf','bici_int','sup','inf','bici_z2','movil']};
const SLOTS={sup:['empuje','tiron','empuje','tiron','core'],inf:['piernas','core','piernas','piernas','core'],full:['piernas','empuje','tiron','piernas','core','cardio']};
const EXTRA={sup:'core',inf:'cardio',full:'core'};
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=hash(seed);return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
// Los intervalos alternan cada semana: semanas impares en bici, semanas pares con soga.
function weekPlan(mon){const av=[];S.settings.days.forEach((v,i)=>{if(v)av.push(i);});
  const soga=mon&&weekInfo(mon).wk%2===1;
  const plan=Array(7).fill(null);const tpl=TPL[av.length]||[];av.forEach((d,i)=>plan[d]=soga&&tpl[i]==='bici_int'?'soga_int':tpl[i]);return plan;}
function weekInfo(mon){const wk=Math.max(0,weeksBetween(parse(S.settings.start),mon));const phase=wk%4;
  return{wk,phase,meso:Math.floor(wk/4),deload:phase===3,label:`Semana ${wk+1} · ${phase===3?'descarga':'carga '+(phase+1)+'/3'}`};}

function buildSession(mon,di,forceType,alt){
  const plan=weekPlan(mon);const type=forceType||plan[di];if(!type)return null;
  const outdoor=!!OUTDOOR[type],useAlt=outdoor&&(alt!=null?!!alt:!!(S.alt&&S.alt[ymd(addDays(mon,di))]));
  if(useAlt)return buildIndoor(mon,di,type,plan);
  const occ=forceType?0:plan.slice(0,di).filter(t=>t===type).length;
  const lv=S.settings.level,dur=S.settings.dur,W=weekInfo(mon);
  const rnd=rng(ymd(mon)+'|'+type+'|'+occ+'|'+lv);
  const used=new Set();
  const pick=g=>{let pool=EX.filter(e=>e.g===g&&!e.nopick&&e.lv<=lv&&!used.has(e.id));
    if(!pool.length)pool=EX.filter(e=>e.g===g&&!e.nopick&&!used.has(e.id));
    const e=pool[Math.floor(rnd()*pool.length)];used.add(e.id);return e;};
  const presc=(e,sets,rest)=>{const it={id:e.id,sets,rest};
    if(e.r)it.reps=Math.min(25,Math.max(5,e.r[lv-1]+(W.deload?-2:W.phase)+W.meso*2));
    else it.time=Math.min(90,Math.max(15,e.t[lv-1]+(W.deload?-5:W.phase*5)+W.meso*10));
    return it;};
  const timed=(id,sec,sets=1,rest=10,extra)=>Object.assign({id,sets,time:sec,rest},extra||{});
  const restMain=[60,45,40][lv-1];
  const baseSets=dur===20?2:3,sets=W.deload?Math.max(2,baseSets-1):baseSets;
  const s={type,histType:type,outdoor,alt:false,name:TYPES[type].n,desc:TYPES[type].d,warm:[],main:[],cool:[],week:W,lv,dur};
  const mob=n=>{const ids=['gatovaca','cadera','isquios','circulos'];const out=[];
    while(out.length<n&&out.length<ids.length){const id=ids[Math.floor(rnd()*ids.length)];if(!out.includes(id))out.push(id);}
    return out.map(id=>timed(id,40,1,10));};

  if(SLOTS[type]){
    let slots=SLOTS[type].slice();
    if(dur===20)slots.pop();if(dur===45)slots.push(EXTRA[type]);
    s.warm=[timed('jacks',30),timed('circulos',30),timed('gatovaca',30)];
    s.main=slots.map(g=>presc(pick(g),sets,restMain));
    s.cool=mob(2);
  }else if(type==='bici_int'){
    const rounds=Math.max(4,[6,8,10][lv-1]+(dur===20?-2:dur===45?2:0)+(W.deload?-2:0)+Math.min(W.meso,2));
    const work=[30,30,40][lv-1],rec=[90,75,60][lv-1];
    s.warm=[timed('bici_suave',300,1,15)];
    s.main=[timed('bici_int',work,rounds,rec,{restLabel:'Pedaleo suave'}),timed('bici_suave',300,1,30)];
    if(dur>=30){s.main.push(presc(pick('core'),2,restMain),presc(pick('core'),2,restMain));}
    s.cool=mob(1);
  }else if(type==='soga_int'){
    const rounds=Math.max(5,[8,10,12][lv-1]+(dur===20?-2:dur===45?2:0)+(W.deload?-2:0)+Math.min(W.meso,2));
    const work=[30,40,45][lv-1],rec=[60,50,40][lv-1],ex={restLabel:'Recuperación: caminá suave'};
    s.warm=[timed('jacks',30),timed('circulos',30),timed('soga',45,1,20)];
    s.main=lv===1?[timed('soga',work,rounds,rec,ex)]
      :[timed('soga',work,Math.ceil(rounds/2),rec,Object.assign({circ:1},ex)),timed('soga_alt',work,Math.floor(rounds/2),rec,Object.assign({circ:1},ex))];
    if(dur>=30){s.main.push(presc(pick('core'),2,restMain),presc(pick('core'),2,restMain));}
    s.cool=mob(2);
  }else if(type==='bici_z2'){
    const lastDay=plan.lastIndexOf('bici_z2')===di&&plan.filter(Boolean).length>=5;
    let min=dur+10+Math.min(W.meso,4)*5-(W.deload?10:0);
    const id=lastDay&&dur>=30?'bici_larga':'bici_suave';if(id==='bici_larga')min+=15;
    s.main=[timed(id,Math.max(15,min)*60,1,0)];
    s.cool=mob(3);
  }else if(type==='movil'){
    s.main=['gatovaca','cadera','isquios','circulos'].map(id=>timed(id,40,2,15));
    s.cool=[timed('caminata',Math.max(15,dur-10)*60,1,0)];
  }else if(type==='extra'){
    s.main=['circulos','gatovaca','cadera','isquios'].map(id=>timed(id,40,1,10));
  }
  s.est=estimate(s);
  return s;
}
// Plan B en casa para los días de bici o caminata: mismo objetivo, en circuito y sin equipo.
function buildIndoor(mon,di,type,plan){
  const occ=plan.slice(0,di).filter(t=>t===type).length;
  const lv=S.settings.level,dur=S.settings.dur,W=weekInfo(mon);
  const rnd=rng(ymd(mon)+'|'+type+'|casa|'+occ+'|'+lv);
  const ht=type+'_casa';
  const s={type,histType:ht,outdoor:true,alt:true,name:TYPES[ht].n,desc:TYPES[ht].d,warm:[],main:[],cool:[],week:W,lv,dur};
  const timed=(id,sec,sets=1,rest=10,extra)=>Object.assign({id,sets,time:sec,rest},extra||{});
  const choose=(ids,n)=>{ids=ids.slice();const out=[];while(out.length<n&&ids.length)out.push(ids.splice(Math.floor(rnd()*ids.length),1)[0]);return out;};
  const restMain=[60,45,40][lv-1];
  const mob=n=>choose(['gatovaca','cadera','isquios','circulos'],n).map(id=>timed(id,40,1,10));
  const corePresc=id=>{const e=EXI[id],it={id,sets:2,rest:restMain};
    if(e.r)it.reps=Math.min(25,Math.max(5,e.r[lv-1]+(W.deload?-2:W.phase)+W.meso*2));
    else it.time=Math.min(90,Math.max(15,e.t[lv-1]+(W.deload?-5:W.phase*5)+W.meso*10));return it;};
  if(type==='bici_int'||type==='soga_int'){
    const rounds=Math.max(4,[6,8,10][lv-1]+(dur===20?-2:dur===45?2:0)+(W.deload?-2:0)+Math.min(W.meso,2));
    const work=[30,30,40][lv-1],rec=[60,50,40][lv-1];
    const pool=['jacks','rodillas','boxeo'].concat(lv>=2?['escaladores','salto']:[],lv>=3?['burpees']:[]);
    const ids=choose(pool,Math.min(4,pool.length)),vueltas=Math.max(1,Math.round(rounds/ids.length));
    s.warm=[timed('marcha',120,1,10),timed('circulos',30),timed('jacks',30)];
    s.main=ids.map(id=>timed(id,work,vueltas,rec,{restLabel:'Recuperación: marchá suave',circ:1}));
    if(dur>=30)s.main=s.main.concat(choose(EX.filter(e=>e.g==='core'&&e.lv<=lv).map(e=>e.id),2).map(corePresc));
    s.cool=mob(1);
  }else if(type==='bici_z2'){
    const lastDay=plan.lastIndexOf('bici_z2')===di&&plan.filter(Boolean).length>=5;
    const min=Math.min(40,Math.max(15,dur+(lastDay&&dur>=30?5:0)+Math.min(W.meso,4)*2-(W.deload?5:0)));
    const ids=['marcha','boxeo'].concat(choose(['sentadilla','rodillas','jacks','talones','puente','zancada'],3));
    const secs=id=>['marcha','boxeo','rodillas','jacks'].includes(id)?60:40;
    const vuelta=ids.reduce((a,id)=>a+secs(id)+15,0),vueltas=Math.max(2,Math.round(min*60/vuelta));
    s.warm=[timed('circulos',30),timed('gatovaca',30)];
    s.main=ids.map(id=>timed(id,secs(id),vueltas,15,{restLabel:'Pausa corta',circ:1}));
    s.cool=mob(2);
  }else{
    const vueltas=Math.max(3,Math.round((dur-8)*60/200));
    s.warm=['gatovaca','cadera','isquios','circulos'].map(id=>timed(id,40,1,10));
    s.main=[timed('marcha',120,vueltas,10,{restLabel:'Pausa corta',circ:1}),timed('boxeo',60,vueltas,10,{restLabel:'Pausa corta',circ:1})];
  }
  s.est=estimate(s);
  return s;
}
function estimate(s){let sec=0;
  for(const it of[...s.warm,...s.main,...s.cool]){const e=EXI[it.id];const w=(it.time||it.reps*3.5)*(e.side&&!it.time?2:1);
    sec+=it.sets*w+(it.sets-1)*it.rest+15+it.rest;}
  return Math.max(5,Math.round(sec/60));}
const fmtT=sec=>{sec=Math.max(0,Math.ceil(sec));const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');};
function prescTxt(it){const e=EXI[it.id];
  if(it.time>=120)return{big:Math.round(it.time/60)+' min',small:it.sets>1?it.sets+' rondas':''};
  if(it.time)return{big:(it.sets>1?it.sets+' × ':'')+it.time+' s',small:e.side?'por lado':(it.restLabel?'rec. '+it.rest+' s':'')};
  return{big:it.sets+' × '+it.reps,small:e.side?'por lado':'reps'};}

let WO=null,AC=null;
function ensureAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();}catch(e){}}
function beep(f=880,d=.15){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='sine';
  g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.3,AC.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d+.05);}catch(e){}}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
function startWorkout(s){
  ensureAudio();
  const all=[...s.warm.map(x=>({...x,sec:'Entrada en calor'})),...s.main.map(x=>({...x,sec:'Bloque principal'})),...s.cool.map(x=>({...x,sec:'Vuelta a la calma'}))];
  // Lista de series: los ejercicios marcados como circuito se hacen por vueltas (A, B, C, A, B, C...).
  const works=[];
  for(let ii=0;ii<all.length;){
    const it=all[ii];
    if(it.circ){let jj=ii;while(jj<all.length&&all[jj].circ)jj++;
      const grp=all.slice(ii,jj),R=Math.max(...grp.map(x=>x.sets));
      for(let r=1;r<=R;r++)grp.forEach((x,gi)=>{if(x.sets>=r)works.push({k:'work',it:x,set:r,ii:ii+gi,circ:true});});
      ii=jj;}
    else{for(let k=1;k<=it.sets;k++)works.push({k:'work',it,set:k,ii});ii++;}
  }
  const steps=[];
  works.forEach((w,j)=>{steps.push(w);const nw=works[j+1];
    if(nw&&w.it.rest>0){const same=nw.it===w.it||(w.circ&&nw.circ);
      steps.push({k:'rest',dur:w.it.rest,label:same&&w.it.restLabel?w.it.restLabel:'Descanso',next:nw.it,nextSet:nw.set,nextCirc:!!nw.circ});}});
  WO={s,steps,i:0,n:all.length,start:Date.now(),timer:null,exitArm:false,lock:null};
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{if(WO)WO.lock=l;}).catch(()=>{});}catch(e){}
  showStep();
}
function closeWorkout(){if(WO&&WO.lock){try{WO.lock.release();}catch(e){}}WO=null;document.getElementById('wo-root').innerHTML='';render();}
function finishWorkout(){
  const min=Math.max(1,Math.round((Date.now()-WO.start)/60000));
  S.history.push({d:ymd(today()),type:WO.s.histType||WO.s.type,min});commit();
  const root=document.getElementById('wo-root');
  root.innerHTML=`<div class="wo"><div class="wo-in" style="justify-content:center">
    <span class="eyebrow">${WO.s.week.label}</span><h1 style="font-size:52px;text-transform:uppercase">Sesión completa</h1>
    <div class="kpis"><div class="kpi"><b>${min}</b><span>minutos</span></div><div class="kpi"><b>${WO.n}</b><span>ejercicios</span></div><div class="kpi"><b>${streak()}</b><span>días de racha</span></div></div>
    <p class="muted">${WO.s.name} quedó registrada en tu progreso.</p>
    <button class="btn pri wide" data-act="wo-close">Listo</button></div></div>`;
  beep(660,.15);setTimeout(()=>beep(990,.3),180);vib([100,60,200]);
  if(WO.lock){try{WO.lock.release();}catch(e){}}WO.lock=null;
}
function showStep(){
  const st=WO.steps[WO.i],root=document.getElementById('wo-root');
  const pct=Math.round(WO.i/WO.steps.length*100);
  const top=`<div class="wo-top"><button class="btn sec ${WO.exitArm?'danger':''}" style="padding:9px 14px" data-act="wo-exit">${WO.exitArm?'¿Salir? Tocá de nuevo':'✕ Salir'}</button>
    <span class="note num" style="font-size:16px">${WO.i+1} / ${WO.steps.length}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  if(st.k==='work'){
    const it=st.it,e=EXI[it.id],tm=!!it.time;
    WO.timer=tm?{left:it.time,running:false,last:0,beeped:0}:null;
    root.innerHTML=`<div class="wo"><div class="wo-in">${top}
      <span class="eyebrow">${it.sec} · Ejercicio ${st.ii+1} de ${WO.n} · ${st.circ?'Vuelta':it.id==='bici_int'||it.id==='soga'?'Ronda':'Serie'} ${st.set} de ${it.sets}</span>
      <div class="art" id="wo-art"></div>
      <button class="wo-name" data-act="detail" data-id="${e.id}">${e.n} <span class="note" style="font-family:var(--f-body);text-transform:none;font-size:13px;font-weight:500">ⓘ cómo hacerlo</span></button>
      <div class="big">${tm?`<span id="wo-time">${fmtT(it.time)}</span>`:`<span>${it.reps}</span><small>reps${e.side?' por lado':''}</small>`}${tm&&e.side?'<small>por lado</small>':''}</div>
      <div class="row-btns">${tm?`<button class="btn pri" data-act="wo-toggle" id="wo-tg">Iniciar</button><button class="btn sec" data-act="wo-next">Terminar serie</button>`
        :`<button class="btn pri wide" data-act="wo-next">✓ Serie hecha</button>`}</div>
    </div></div>`;
    mountFig(document.getElementById('wo-art'),e.a,'Demostración: '+e.n);
  }else{
    const nx=st.next,e=EXI[nx.id];
    WO.timer={left:st.dur,running:true,last:performance.now(),beeped:0};
    root.innerHTML=`<div class="wo rest"><div class="wo-in">${top}
      <span class="eyebrow">${st.label}</span>
      <div class="big"><span id="wo-time">${fmtT(st.dur)}</span></div>
      <div class="row-btns"><button class="btn sec" data-act="wo-add">+15 s</button><button class="btn pri" data-act="wo-next">Saltar descanso</button></div>
      <span class="eyebrow">A continuación</span>
      <div class="art" id="wo-next-art"></div>
      <div><div class="tt" style="font-size:18px">${e.n}</div><div class="note">${st.nextCirc?'Vuelta':nx.id==='bici_int'||nx.id==='soga'?'Ronda':'Serie'} ${st.nextSet} de ${nx.sets} · ${nx.reps?nx.reps+' reps':prescTxt(nx).big.replace(/^\d+ × /,'')}${e.side?' por lado':''}</div></div>
    </div></div>`;
    mountFig(document.getElementById('wo-next-art'),e.a,'Demostración: '+e.n);
  }
}
function nextStep(){if(!WO)return;WO.exitArm=false;WO.i++;if(WO.i>=WO.steps.length)finishWorkout();else showStep();}
setInterval(()=>{
  if(!WO||!WO.timer)return;const T=WO.timer;
  if(T.running){const now=performance.now();T.left-=(now-T.last)/1000;T.last=now;
    const sec=Math.ceil(T.left);if(sec<=3&&sec>0&&sec!==T.beeped){T.beeped=sec;beep(660,.12);}
    if(T.left<=0){T.running=false;beep(990,.35);vib(250);nextStep();return;}}
  const el=document.getElementById('wo-time');if(el)el.textContent=fmtT(T.left);
},200);

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('.tab');if(tb){location.hash='#'+tb.dataset.tab;if(location.hash.replace('#','')!==UI.tab)route();return;}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,st=S.settings;
  if(a!=='reset'&&a!=='clear'&&UI.confirm){UI.confirm=null;}
  switch(a){
    case 'detail':openDetail(b.dataset.id,b.dataset.it?JSON.parse(b.dataset.it):null);break;
    case 'close-sheet':if(ev.target===b||b.classList.contains('icon-btn'))document.getElementById('sheet-root').innerHTML='';break;
    case 'start':{const d=parse(b.dataset.date);const s=buildSession(monday(d),dow(d),b.dataset.type||null);if(s)startWorkout(s);break;}
    case 'toggle-done':{const ds=b.dataset.date;const idx=S.history.findIndex(h=>h.d===ds);
      if(idx>=0)S.history=S.history.filter(h=>h.d!==ds);else S.history.push({d:ds,type:b.dataset.type,min:+b.dataset.min,manual:1});
      commit();break;}
    case 'goto-day':{const d=parse(b.dataset.date);UI.weekOff=weeksBetween(monday(today()),monday(d));UI.selDay=dow(d);location.hash='#semana';break;}
    case 'wk':UI.weekOff+=+b.dataset.d;UI.selDay=UI.weekOff===0?dow(today()):0;render();break;
    case 'sel-day':{const i=+b.dataset.i;UI.selDay=UI.selDay===i?-1:i;render();break;}
    case 'alt':{const ds=b.dataset.date;S.alt=S.alt||{};if(b.dataset.v==='1')S.alt[ds]=1;else delete S.alt[ds];
      const lim=ymd(addDays(today(),-60));for(const k in S.alt)if(k<lim)delete S.alt[k];commit();break;}
    case 'filter':UI.filter=b.dataset.f;render();break;
    case 'day':st.days[+b.dataset.i]=st.days[+b.dataset.i]?0:1;commit();break;
    case 'level':st.level=+b.dataset.v;commit();break;
    case 'dur':st.dur=+b.dataset.v;commit();break;
    case 'reset':if(UI.confirm==='reset'){UI.confirm=null;st.start=ymd(monday(today()));commit();}else{UI.confirm='reset';render();}break;
    case 'clear':if(UI.confirm==='clear'){UI.confirm=null;S.history=[];commit();}else{UI.confirm='clear';render();}break;
    case 'wo-next':nextStep();break;
    case 'wo-toggle':{const T=WO&&WO.timer;if(!T)break;T.running=!T.running;T.last=performance.now();ensureAudio();
      const tg=document.getElementById('wo-tg');if(tg)tg.textContent=T.running?'Pausar':'Seguir';break;}
    case 'wo-add':if(WO&&WO.timer){WO.timer.left+=15;WO.timer.beeped=0;}break;
    case 'wo-exit':if(WO&&WO.exitArm)closeWorkout();else if(WO){WO.exitArm=true;b.textContent='¿Salir? Tocá de nuevo';b.classList.add('danger');}break;
    case 'wo-close':closeWorkout();break;
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&document.getElementById('sheet-root').innerHTML)document.getElementById('sheet-root').innerHTML='';});
route();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
